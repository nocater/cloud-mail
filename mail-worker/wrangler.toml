name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "ca049886-cec5-4fe3-83f5-80f9a3c83e59"

[[kv_namespaces]]
binding = "kv"
id = "0dcd31f75c64426a8fcb83c4ee2f7003"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
# Preserve existing dashboard domain, admin and jwt_secret with keep_vars=true.

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
